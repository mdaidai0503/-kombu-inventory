play:flex;gap:20px;flex-wrap:wrap}.pdf-parties p{flex:1;min-width:180px}.pdf-pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}.pdf-pair section{margin:10px 0;padding:12px;min-width:0}.pdf-pair p,.pdf-pair h4{overflow-wrap:anywhere}.pdf-pair iframe{display:block;width:100%;height:600px;border:1px solid #ccd8df;margin-top:12px}.pdf-pair a{display:inline-block;margin:10px 0}.paired-waybill{padding:10px;border:1px solid #dce4de;margin:12px 0}dialog:has(.pdf-pair){max-width:1350px}@media(max-width:700px){.pdf-pair{grid-template-columns:1fr}.pdf-pair iframe{height:430px}.history-wrap{max-width:100%}}#content article p{overflow-wrap:anywhere}#content article button{margin:4px}#operations button{flex:1 1 130px;min-width:120px}.matrix-wrap{overflow:auto;max-height:75vh;isolation:isolate;border:1px solid #b6c7ba}.stock-matrix{width:max-content!important;min-width:100%!important;border-collapse:separate;border-spacing:0}.stock-matrix td,.stock-matrix th{border-right:1px solid #cdd9cf;border-bottom:1px solid #cdd9cf;min-width:56px;padding:8px;text-align:right;white-space:nowrap!important}.stock-matrix thead th{background:#e7efe5;position:sticky;top:0;z-index:3;text-align:center}.stock-matrix thead tr:nth-child(2) th{top:37px}.stock-matrix .fixed-one{position:sticky;left:0;min-width:112px;max-width:112px;width:112px;background:#f4f7ee;z-index:2;text-align:left}.stock-matrix .fixed-two{position:sticky;left:112px;min-width:54px;background:#f4f7ee;z-index:2;text-align:center}.stock-matrix thead .fixed-one,.stock-matrix thead .fixed-two{z-index:4}.stock-matrix tfoot{font-weight:700;background:#e7efe5}.stock-matrix .warn{color:#a51f1f}.stock-matrix .group-start th,.stock-matrix .group-start td{border-top:2px solid #9dad9d}dialog{max-width:900px;width:calc(100% - 24px);max-height:90vh;border:1px solid #becdbe;border-radius:12px;padding:18px}dialog::backdrop{background:#0008}#actionBody form label{margin:10px 0}#actionBody input[type=checkbox]{width:auto;display:inline;min-heig </style><main><small>山三商事 · 昆布管理</small><h1>昆布帳 <small>v0.1.31</small></h1><p class="notice">本番データを表示しています。送り状添付は確認用コピーで試せます。入出庫登録・FAX送信は本番切替後に利用できます。</p><section id="login"><form id="loginForm"><h2>現行アプリのアカウントでログイン</h2><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton">ログインして在庫を表示</button></form><small>この画面を閉じると、再ログインが必要です。</small></section><p id="status" role="status">ログイン待ち</p><div id="workspace" hidden><div class="toolbar"><button id="reload">最新データを読み込む</button><button id="logout">ログアウト</button></div><p id="modeNotice" class="notice"></p><div id="operations" class="toolbar" hidden><button id="registerIn" data-write disabled>入庫登録</button><button id="registerOut" data-write disabled>出庫登録</button><button id="newRequest" data-write disabled>出荷依頼を作成</button><button id="checkFax" data-write disabled>FAX送信結果を確認</button><button id="backup">全データバックアップ</button><button id="pendingCopy" hidden>未反映入力を保存</button></div><div id="metrics"></div><div id="tabs" class="toolbar"><button data-view="waybills" aria-pressed="false">送り状FAX</button><button data-view="stock" aria-pressed="true">在庫</button><button data-view="logs" aria-pressed="false">入出庫履歴</button><button data-view="shipments" aria-pressed="false">出荷依頼</button></div><div class="toolbar"><select id="product" aria-label="産地"><option value="kushiro">釧路</option><option value="hidaka">日高</option><option value="nemuro">根室</option><option value="sanmae">釧棹</option></select><select id="year" aria-label="年産"><option value="">全年産</option></select><input id="search" aria-label="検索" placeholder="漁協・等級・会社名で検索"></div><small id="subtitle"></small><section id="content"></section></div></main><dialog id="actionDialog"><button id="closeAction" type="button">閉じる</button><div id="actionBody"></div></dialog><script>(function(root){
'use strict';
const PRODUCTS={kushiro:'釧路',nemuro:'根室',hidaka:'日高',sanmae:'釧棹'};
const keys={kushiro:'kombu_local_only_v3',nemuro:'kombu_nemuro_local_v1',hidaka:'kombu_hidaka_local_v1',sanmae:'kombu_kushiro_sanmae_local_v1'};
const clone=x=>JSON.parse(JSON.stringify(x));
function empty(){return {schema:'kombu-next-v1',products:Object.fromEntries(Object.keys(PRODUCTS).map(p=>[p,{records:[],shipments:[],companies:[]}])),waybills:[],links:[],reconciliations:[],audit:[],legacy:null};}
function importBackup(raw){
 if(!raw||typeof raw!=='object')throw Error('JSON形式が違います');
 if(raw.schema==='kombu-next-v1'){const x=clone(raw);validate(x);return x;}
 const next=empty();let found=0;
 for(const p of Object.keys(PRODUCTS)){
  let v=raw[p]??raw[keys[p]];if(typeof v==='string')v=JSON.parse(v);
  if(v){if(!Array.isArray(v.records)||!Array.isArray(v.shipments))throw Error(PRODUCTS[p]+'の入出庫・出荷依頼形式を確認してください');next.products[p]=clone(v);found++;}
 }
 if(!found)throw Error('旧アプリの「全データバックアップ」JSONを選んでください。産地別バックアップは未対応です。');
 if(found!==4)throw Error('4産地がそろっていません。全データバックアップを使用してください');
 next.legacy=clone(raw);validate(next);return next;
}
function validate(db){
 for(const p of Object.keys(PRODUCTS)){
  const data=db.products?.[p];if(!data||!Array.isArray(data.records)||!Array.isArray(data.shipments))throw Error('データが不足しています: '+p);
  for(const r of data.records)if(!Number.isFinite(Number(r.qty))||Number(r.qty)<0)throw Error('数量が不正です: '+p);
  for(const s of data.shipments){if(!Array.isArray(s.lines))throw Error('出荷明細形式が不正です: '+s.id);for(const l of s.lines)if(!Number.isFinite(Number(l.qty))||Number(l.qty)<0)throw Error('明細数量が不正です: '+s.id);}
 }
 if(!Array.isArray(db.waybills)||!Array.isArray(db.links)||!Array.isArray(db.audit)||!Array.isArray(db.reconciliations))throw Error('新アプリの形式が不正です');
}
function key(p,r){return JSON.stringify(p==='hidaka'?[r.year||'R7',r.location||'',r.section||'',r.grade||'']:[r.year||'R7',r.coop||'',r.season||(p==='kushiro'?'夏':''),r.group||'',r.item||'']);}
function stock(db,p){
 const rows=new Map();const add=(r,amount)=>{const k=key(p,r);if(!rows.has(k))rows.set(k,{...r,stockKey:k,qty:0});rows.get(k).qty+=amount;};
 for(const r of db.products[p].records)add(r,(r.type==='out'?-1:1)*Number(r.qty));
 for(const s of db.products[p].shipments)if(s.status==='confirmed')for(const l of s.lines)add(l,-Number(l.qty));
 return [...rows.values()].sort((a,b)=>key(p,a).localeCompare(key(p,b),'ja'));
}
function id(){return 'NEXT-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random());}
function log(db,action,detail){db.audit.push({at:new Date().toISOString(),action,detail});}
function movement(db,p,line,type,date,memo){
 if(!['in','out'].includes(type)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Number(line.qty))||Number(line.qty)<=0)throw Error('日付・数量を確認してください');
 if(type==='out'){const have=stock(db,p).find(r=>key(p,r)===key(p,line))?.qty||0;if(Number(line.qty)>have)throw Error('在庫を超える出庫です');}
 db.products[p].records.push({...clone(line),id:id(),type,date,memo});log(db,'入出庫登録',{product:p,type,qty:line.qty});
}
function createShipment(db,p,lines,source,dest,date){
 if(!lines.length||!source.trim()||!dest.trim()||!date)throw Error('出荷元・出荷先・依頼日・明細を入力してください');
 for(const l of lines)if(Number(l.qty)<=0||!Number.isFinite(Number(l.qty)))throw Error('明細数量を確認してください');
 const s={id:id(),status:'draft',shipDate:date,requestDate:date,source:{name:source},destInfo:{name:dest},lines:clone(lines),createdAt:new Date().toISOString()};
 db.products[p].shipments.push(s);log(db,'出荷下書き作成',{product:p,id:s.id});return s;
}
function confirmShipment(db,p,s,date){
 if(s.status!=='draft')throw Error('下書きだけ確定できます');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date||s.requestDate||s.shipDate||''))throw Error('確定日を入力してください');
 const demand=new Map();for(const l of s.lines)demand.set(key(p,l),(demand.get(key(p,l))||0)+Number(l.qty));
 const have=new Map(stock(db,p).map(r=>[r.stockKey,r.qty]));
 for(const [k,q]of demand)if(q>(have.get(k)||0))throw Error('在庫を超える数量です');
 s.status='confirmed';s.confirmationDate=date||s.requestDate||s.shipDate;s.confirmedAt=new Date().toISOString();log(db,'出荷確定',{product:p,id:s.id});
}
function cancelShipment(db,p,s){if(!['draft','confirmed'].includes(s.status))throw Error('出荷済みは取消できません');s.previousStatus=s.status;s.cancellationDate=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});s.status='cancelled';s.cancelledAt=new Date().toISOString();log(db,'出荷取消',{product:p,id:s.id});}
function linkedOuts(db,p,s){return db.products[p].records.filter(r=>r.type==='out'&&(String(r.shipmentId||'')===String(s.id)||String(r.faxboxShipmentId||'')===String(s.id)));}
function sameShipmentQuantities(p,lines,records){
 const totals=xs=>{const m=new Map();for(const r of xs){const k=key(p,r);m.set(k,(m.get(k)||0)+Number(r.qty));}return m;};
 const a=totals(lines),b=totals(records);return a.size===b.size&&[...a].every(([k,q])=>b.has(k)&&b.get(k)===q);
}
function completeShipment(db,p,s,date,meta={}){
 if(!db.products[p]||!db.products[p].shipments.includes(s))throw Error('産地・依頼の対応を確認してください');
 if(!['confirmed','shipped'].includes(s.status))throw Error('確定した依頼だけ出荷済みにできます。下書き・取消済みは確認が必要です');
 const old=linkedOuts(db,p,s);
 if(old.some(r=>r.shipmentId&&r.faxboxShipmentId&&String(r.shipmentId)!==String(r.faxboxShipmentId)))throw Error('既存出庫の依頼参照が矛盾しています');
 if(old.length&&!sameShipmentQuantities(p,s.lines,old))throw Error('既存出庫と依頼明細が一致しません。出庫は追加せず確認してください');
 if(s.status==='shipped'&&!old.length)throw Error('出荷済み依頼の出庫記録がありません。自動再作成せず確認してください');
 if(s.status!=='shipped'){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))throw Error('出庫記帳日を確認してください');
  if(meta.kind!=='fax'&&date<(s.confirmationDate||''))throw Error('手動出荷日は確定日以降にしてください');
 }
 // Validate everything before making changes. A complete existing OUT is reused.
 const fresh=s.status!=='shipped'&&!old.length;
 if(fresh){for(const l of s.lines){db.products[p].records.push({...clone(l),id:id(),type:'out',date,memo:(meta.kind==='fax'?'FAX送信完了 出荷依頼 ':'出荷依頼 ')+s.id,shipmentId:s.id,...(meta.kind==='fax'?{faxboxShipmentId:s.id,faxboxJobId:meta.jobId}:{} )});}}
 if(s.status!=='shipped'){s.status='shipped';s.shippedAt=meta.detectedAt||new Date().toISOString();s.completionKind=meta.kind||'manual';if(meta.kind!=='fax')s.actualShipDate=date;else s.faxAccountingDate=old.length?old.map(r=>r.date).filter(Boolean).sort().at(-1):date;}
 if(meta.kind==='fax'){
  s.faxboxStatus='sent';s.faxboxJobId=meta.jobId;
  s.faxCompletions=Array.isArray(s.faxCompletions)?s.faxCompletions:[];
  if(!s.faxCompletions.some(x=>x.jobId===meta.jobId)){s.faxCompletions.push({jobId:meta.jobId,detectedAt:meta.detectedAt,serverSentAt:meta.serverSentAt||null});log(db,'FAX送信成功反映',{product:p,id:s.id,jobId:meta.jobId,outCreated:fresh});}
 }else if(fresh){log(db,'手動出荷登録',{product:p,id:s.id,date});}
 return {created:fresh,reused:!fresh,product:p,shipmentId:s.id};
}
function ship(db,p,s,date){return completeShipment(db,p,s,date,{kind:'manual'});}
function applyFaxSuccess(db,job){
 if(!job||!['sent','completed','success','succeeded'].includes(job.status)||!String(job.id||'').trim()||job.source_app!=='kombu_inventory')throw Error('昆布アプリのFAX送信成功情報を確認してください');
 if(!Array.isArray(job.targets)||!job.targets.length)throw Error('産地と依頼IDの明示的な対応が必要です。旧配列から推測しません');
 const ids=new Set();const planned=[];
 for(const target of job.targets){
  if(!target||!Object.hasOwn(PRODUCTS,target.product)||!String(target.shipmentId||'').trim())throw Error('FAX対象の産地・依頼IDが不正です');
  const token=JSON.stringify([target.product,String(target.shipmentId)]);if(ids.has(token))throw Error('FAX対象が重複しています');ids.add(token);
  const matches=db.products[target.product].shipments.filter(x=>String(x.id)===String(target.shipmentId));if(matches.length!==1)throw Error('FAX対象の依頼を一意に特定できません');
  const s=matches[0];if(s.faxboxJobId&&s.faxboxJobId!==job.id)throw Error('現在のFAXジョブと一致しません。古い成功情報を自動反映しません');
  if(!Array.isArray(target.lines)||!sameShipmentQuantities(target.product,s.lines,target.lines))throw Error('送信した明細と現在の依頼が一致しません');
  // Preserve the current accounting date rule; never invent an actual shipment date.
  if(!s.shipDate&&s.status!=='shipped')throw Error('依頼日がありません。出庫記帳日を確認してください');
  planned.push({p:target.product,s,date:s.shipDate});
 }
 const detectedAt=new Date().toISOString();
 // Run on a clone first so a failure in any target cannot partially finish a job.
 const probe=clone(db);
 for(const x of planned){const ps=probe.products[x.p].shipments.find(y=>String(y.id)===String(x.s.id));completeShipment(probe,x.p,ps,x.date,{kind:'fax',jobId:job.id,detectedAt,serverSentAt:job.sent_at||null});}
 validate(probe);
 const results=[];for(const x of planned)results.push(completeShipment(db,x.p,x.s,x.date,{kind:'fax',jobId:job.id,detectedAt,serverSentAt:job.sent_at||null}));
 return results;
}

function source(s){return s.source?.name||(typeof s.source==='string'?s.source:'')||s.source_name||'';}function dest(s){return s.destInfo?.name||s.dest_name||(typeof s.dest==='object'?s.dest?.name:s.dest)||'';}
function receipt(w){const m=String(w.original_filename||'').match(/^FAX_(20\d{2})(\d{2})(\d{2})\d{6}(?:_|\.|$)/i);return w.receiptDate||(m?`${m[1]}-${m[2]}-${m[3]}`:'');}
const norm=x=>String(x||'').normalize('NFKC').replace(/株式会社|\(株\)|有限会社|\(有\)|\s/g,'').toLowerCase();
function candidates(db,p,s){const req=s.requestDate||s.shipDate||s.ship_date||'';return db.waybills.filter(w=>!w.deleted&&(!req||!receipt(w)||receipt(w)>=req)&&!db.links.some(l=>l.product===p&&l.shipmentId===s.id&&l.waybillId===w.id)).map(w=>{
 const f=w.parsed_data?.analysis||w.parsed_data||w;const ws=w.source_name||f.raw_shipper_name||f.source_name,wd=w.destination_name||f.raw_consignee_name||f.dest_name,wq=w.total_qty??f.total_qty;
 const eq=(a,b)=>!a||!b?'未読':norm(a)===norm(b)?'一致':'相違';
 const sq=s.lines.reduce((t,l)=>t+Number(l.qty),0);const labels=[eq(source(s),ws),eq(dest(s),wd),Number(wq)>0?(Number(wq)===sq?'一致':'相違'):'未読'];
 return {...w,source:ws||'',dest:wd||'',quantity:wq,agreement:labels,score:labels.filter(x=>x==='一致').length};
 }).sort((a,b)=>b.score-a.score||receipt(b).localeCompare(receipt(a)));}
function attach(db,p,s,w){if(db.links.some(l=>l.product===p&&l.shipmentId===s.id&&l.waybillId===w.id))return;db.links.push({product:p,shipmentId:s.id,waybillId:w.id,at:new Date().toISOString()});log(db,'FAX添付',{product:p,id:s.id,waybillId:w.id});}
function snapshot(db,p,date){
 const out=new Map();let uncertain=0;
 const add=(r,qty,kind)=>{const k=key(p,r);if(!out.has(k))out.set(k,{...r,stockKey:k,book:0,pending:0});out.get(k)[kind]+=qty;};
 for(const r of db.products[p].records){if(!r.date){uncertain++;continue;}if(r.date<=date)add(r,(r.type==='out'?-1:1)*Number(r.qty),'book');}
 for(const s of db.products[p].shipments){
  if(s.status==='draft')continue;
  const confirmed=s.confirmationDate;

return `<h2>出荷依頼履歴</h2><div class="toolbar"><label>表示<select data-history-filter="scope"><option value="history" ${state.scope==='history'?'selected':''}>出荷依頼履歴（下書きを除く）</option><option value="drafts" ${state.scope==='drafts'?'selected':''}>下書き（${all.filter(r=>r.s.status==='draft').length}件）</option><option value="all" ${state.scope==='all'?'selected':''}>すべて</option></select></label><button id="historyLoadWay">${root.KombuWaybills?.loading?'送り状読み込み中…':'送り状を再読込'}</button></div>${root.KombuWaybills?.error?'<p role="status">'+esc(root.KombuWaybills.error)+' 添付の有無は確定していません。</p>':''}<p>${rows.length}件 ／ PDF欄から出荷依頼書と送り状を一緒に開けます。</p><div class="tablewrap history-wrap"><table class="shipment-history"><thead><tr>${['依頼日','昆布','出荷人','出荷先','個数','状態','送り状','PDF'].map(x=>'<th>'+x+(x==='PDF'?'<label><input type="checkbox" id="historySelectAll">全選択</label><button id="historyPrintSelected" '+(!selected.size?'disabled':'')+'>選択したPDFを印刷（'+selected.size+'件）</button>':'')+'</th>').join('')}</tr><tr><th><select data-history-filter="sort" aria-label="依頼日の順序"><option value="desc" ${state.sort==='desc'?'selected':''}>↓ 降順</option><option value="asc" ${state.sort==='asc'?'selected':''}>↑ 昇順</option></select></th><th><select data-history-filter="product" aria-label="履歴の昆布">${options(Object.entries(M.PRODUCTS),state.product)}</select></th><th><select data-history-filter="source" aria-label="履歴の出荷人">${options(names(M.source),state.source)}</select></th><th><select data-history-filter="dest" aria-label="履歴の出荷先">${options(names(M.dest),state.dest)}</select></th><th>合計</th><th><select data-history-filter="status" aria-label="履歴の状態">${options(Object.entries(statuses),state.status)}</select></th><th><select data-history-filter="waybill" aria-label="履歴の送り状">${options([['missing','未着'],['review','要確認'],['attached','添付済み']],state.waybill)}</select></th><th>依頼書・送り状</th></tr></thead><tbody>${body||'<tr><td colspan="8">該当する出荷依頼はありません。</td></tr>'}</tbody></table></div>`;
}
async function pair(p,id){const s=A.db?.products[p]?.shipments.find(s=>s.id===id);if(!s)return;const generation=++serial,dlg=el('actionDialog');root.KombuPdfViewer?.cleanup();el('actionBody').innerHTML=`<h2>出荷依頼書・送り状 · ${esc(id)}</h2><p>${esc(M.PRODUCTS[p])} ／ 依頼日 ${esc(day(s))} ／ ${total(s)}個</p><div class="pdf-parties"><p>出荷人<br><b>${esc(M.source(s))}</b></p><p>出荷先<br><b>${esc(M.dest(s))}</b></p></div><div class="pdf-pair"><section><h3>出荷依頼PDF</h3><p id="requestPdfStatus">PDFを準備しています…</p><div id="requestPdfCanvases"></div></section><section><h3>添付済みの送り状PDF</h3><p id="pairedWaybillStatus">添付記録を確認しています…</p><div id="pairedWaybills"></div><button id="pairAttachment">候補・添付を確認</button></section></div>`;if(!dlg.open)dlg.showModal();const owner=el('requestPdfStatus'),live=()=>generation===serial&&A.db&&dlg.open&&el('requestPdfStatus')===owner;el('pairAttachment').onclick=()=>root.KombuWaybills.shipment(p,id);
const request=async()=>{try{await document.fonts.ready;await KombuOriginalPdf.ready();if(!live())return;const fields=p==='hidaka'?['location','section','grade']:['coop','season','group','item'];const incomplete=(s.lines||[]).some(r=>fields.some(f=>!String(r[f]??'').trim()));const canvases=incomplete?completeCanvases(p,s):KombuOriginalPdf.canvases(p,{...s,id:s.documentNumber||s.id,dest:s.destInfo||s.dest});const blob=await KombuOriginalPdf.blob(canvases);if(!live())return;const url=URL.createObjectURL(blob);requestUrls.add(url);owner.innerHTML='<a href="'+esc(url)+'" target="_blank" rel="noopener">出荷依頼PDFを開く・印刷</a><br><small>現在の依頼データから作成したPDFです。'+(incomplete?'分類未設定の明細を落とさない確認用書式です。':'')+'</small>';for(const canvas of canvases){canvas.style.cssText='width:100%;height:auto';el('requestPdfCanvases').append(canvas);}}catch(e){if(live())owner.textContent='出荷依頼PDFを表示できません：'+e.message;}};
const waybills=async()=>{try{if(!root.KombuWaybills.loaded)await root.KombuWaybills.load();if(!live())return;if(!root.KombuWaybills.loaded)throw Error(root.KombuWaybills.error||'添付記録を読み込めません。');const w=way(p,s);el('pairedWaybillStatus').textContent=w.links.length?(w.code==='review'?'要確認：送り状と依頼に相違があります。':'添付 '+w.links.length+'件。すべての原本を確認できます。'):(w.code==='review'?'受信済みの候補があります。荷送人・荷受人などを原本で確認してください。':'送り状は未着です。');for(const l of w.links){const card=document.createElement('article');card.className='paired-waybill';card.innerHTML='<h4>'+esc(l.document?.original_filename||l.waybill_inbox_id)+'</h4><p>'+esc(l.copy?'確認用コピー':'本番の既存添付')+' ／ 割当数量 '+esc(l.qty??l.match_detail?.line_qty??'未確認')+(l.pages?.length?' ／ 明細ページ '+esc(l.pages.join(',')):'')+'</p><button>送り状PDFを表示</button><p role="status"></p><div></div>';el('pairedWaybills').append(card);const button=card.querySelector('button'),status=card.querySelector('[role=status]'),holder=card.lastElementChild;button.onclick=async()=>{button.disabled=true;status.textContent='原本を読み込んでいます…';try{const doc=await root.KombuWaybills.openOriginal(l.waybill_inbox_id);if(!live()||!card.isConnected)return;holder.innerHTML='<a href="'+esc(doc.url)+'" target="_blank" rel="noopener">送り状PDFを開く・印刷（全ページ）</a><div class="paired-pdf-pages"></div>';if(doc.external){holder.querySelector('.paired-pdf-pages').textContent='Google Driveに保存された原本です。上のリンクから別画面で確認できます。';}else await KombuPdfViewer.render(holder.querySelector('.paired-pdf-pages'),doc.url,l.pages?.[0]||doc.preset?.allocations[p+'/'+id]?.pages?.[0]||1,()=>live()&&card.isConnected,page=>doc.preset&&page>1?90:0);status.textContent='';button.hidden=true;}catch(e){if(live())status.textContent=e.message;}finally{if(button.isConnected)button.disabled=false;}};if(w.links.length===1)button.click();}}catch(e){if(live())el('pairedWaybillStatus').textContent=e.message;}};
await Promise.allSettled([request(),waybills()]);
}

function requestCanvases(p,s){const fields=p==='hidaka'?['location','section','grade']:['coop','season','group','item'];return (s.lines||[]).some(r=>fields.some(f=>!String(r[f]??'').trim()))?completeCanvases(p,s):KombuOriginalPdf.canvases(p,{...s,id:s.documentNumber||s.id,dest:s.destInfo||s.dest});}
async function printSelected(){const rows=currentRows.filter(r=>selected.has(r.p+'/'+r.s.id));if(!rows.length)return;const generation=serial,popup=window.open('','_blank');if(!popup){A.message('印刷画面を開けません。ポップアップを許可して再度お試しください。');return;}popup.opener=null;popup.document.write('<p>選択した出荷依頼PDFを準備しています…</p>');try{await document.fonts.ready;await KombuOriginalPdf.ready();if(!A.db||generation!==serial||popup.closed){popup.close();return;}const pages=rows.flatMap(r=>requestCanvases(r.p,r.s));const blob=await KombuOriginalPdf.blob(pages);if(!A.db||generation!==serial||popup.closed){popup.close();return;}const url=URL.createObjectURL(blob);requestUrls.add(url);popup.document.open();popup.document.write('<!doctype html><html lang="ja"><meta charset="utf-8"><title>出荷依頼PDF '+rows.length+'件</title><style>@page{size:A4 landscape;margin:0}body{margin:0;background:#eee}.controls{padding:12px;background:white}img{display:block;width:297mm;max-width:100%;height:auto;margin:10px auto;background:white;break-after:page}img:last-child{break-after:auto}@media print{body{background:white}.controls{display:none}img{width:297mm;max-width:none;height:210mm;margin:0;object-fit:contain}}</style><div class="controls"><button onclick="window.print()">印刷</button> <a href="'+url+'" download="出荷依頼PDF_'+rows.length+'件.pdf">PDFを保存</a><p>出荷依頼 '+rows.length+'件 ／ '+pages.length+'ページ。送り状PDFは含みません。</p></div>'+pages.map(c=>'<img alt="出荷依頼PDF" src="'+c.toDataURL('image/jpeg',0.92)+'">').join('')+'</html>');popup.document.close();await Promise.all([...popup.document.images].map(img=>img.decode().catch(()=>{})));if(!popup.closed)popup.print();}catch(e){if(!popup.closed){popup.document.body.textContent='印刷PDFを準備できません：'+e.message;}A.message('印刷PDFを準備できません：'+e.message);}}

function bind(){if(!A.db||el('content').dataset.view!=='shipments')return;el('content').querySelectorAll('[data-history-filter]').forEach(s=>s.onchange=()=>{state[s.dataset.historyFilter]=s.value;if(s.dataset.historyFilter==='scope')state.status='';if(s.dataset.historyFilter==='status'&&s.value==='draft')state.scope='drafts';A.render();});el('content').querySelectorAll('[data-print-request]').forEach(c=>c.onchange=()=>{if(c.checked)selected.add(c.dataset.printRequest);else selected.delete(c.dataset.printRequest);A.render();});const all=el('historySelectAll');all.checked=currentRows.length>0&&selected.size===currentRows.length;all.indeterminate=selected.size>0&&!all.checked;all.onchange=()=>{if(all.checked)currentRows.forEach(r=>selected.add(r.p+'/'+r.s.id));else selected.clear();A.render();};el('historyPrintSelected').onclick=printSelected;el('content').querySelectorAll('[data-month-toggle]').forEach(b=>b.onclick=()=>{const month=b.dataset.monthToggle;if(collapsed.has(month))collapsed.delete(month);else collapsed.add(month);A.render();});el('historyLoadWay').disabled=root.KombuWaybills?.loading||false;el('historyLoadWay').onclick=()=>root.KombuWaybills.load();el('content').querySelectorAll('[data-pdf-pair]').forEach(b=>b.onclick=()=>pair(b.dataset.product,b.dataset.pdfPair));el('content').querySelectorAll('[data-history-way]').forEach(b=>b.onclick=()=>pair(b.dataset.product,b.dataset.historyWay));if(!root.KombuWaybills?.loaded&&!root.KombuWaybills?.loading&&!root.KombuWaybills?.error)root.KombuWaybills.load();}
root.KombuShipmentHistory={html,bind,pair,logout(){serial++;selected.clear();collapsed.clear();currentRows=[];root.KombuPdfViewer?.cleanup();Object.assign(state,{product:'',source:'',dest:'',status:'',waybill:'',sort:'desc'});for(const u of requestUrls)URL.revokeObjectURL(u);requestUrls.clear();}};
})(globalThis);

</script></html>
