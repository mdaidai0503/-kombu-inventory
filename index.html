            return reader.read().then(function(result) {

              }

            });

            finished = true;
            var done = preventCancel
              ? Promise.resolve()

            return done.then(function() {
              try { reader.releaseLock(); } catch(e) {}
              return { done: true, value: value };
            });
          }
        };
        iterator[Symbol.asyncIterator] = function(){ return iterator; };
        return iterator;
      };
