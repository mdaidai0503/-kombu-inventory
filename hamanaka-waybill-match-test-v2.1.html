<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浜中運輸送り状 照合テスト v2.1</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f3f6fa;margin:0;padding:30px;color:#10233d}
.card{max-width:760px;margin:auto;background:white;border:1px solid #d9e1ea;border-radius:16px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.06)}
label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cdd6e1;border-radius:8px}
button{margin-top:16px;background:#0d3768;color:white;border:0;border-radius:8px;padding:11px 18px;font-weight:700}
pre{white-space:pre-wrap;background:#0d1824;color:#e9f2ff;padding:14px;border-radius:10px;min-height:160px;overflow:auto}
.ok{color:#087a35;font-weight:700}.err{color:#b42318;font-weight:700}.note{font-size:13px;color:#53657a}
</style>
</head>
<body>
<div class="card">
<h2>浜中運輸送り状 → 出荷指示 照合テスト v2.1</h2>

<label>OpenAI PDF Analyzer URL</label>
<input id="analyzerUrl" value="https://crltrozxztivkyxtjjxv.supabase.co/functions/v1/openai-pdf-analyzer">

<label>Kombu Waybill Match URL</label>
<input id="matchUrl" value="https://crltrozxztivkyxtjjxv.supabase.co/functions/v1/kombu-waybill-match">

<label>同期トークン</label>
<input id="token" type="password" placeholder="昆布在庫管理アプリ保存済みトークンを自動読込">
<div class="note" id="tokenNote">保存済みトークンを確認しています...</div>

<label>PDF</label>
<input id="file" type="file" accept="application/pdf,.pdf">

<button id="go">AI解析 → 100点照合</button>
<p id="status"></p>
<pre id="out">ここに結果が表示されます。</pre>
</div>

<script>
const $=id=>document.getElementById(id);
const TOKEN_KEY="kombu_sync_token_v1";

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(",")[1]||"");
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function loadSavedToken(){
  const t=(localStorage.getItem(TOKEN_KEY)||"").trim();
  if(t){
    $("token").value=t;
    $("tokenNote").textContent="昆布在庫管理アプリと同じ保存済み同期トークンを読み込みました。";
    $("tokenNote").className="note ok";
  }else{
    $("tokenNote").textContent="保存済みトークンが見つかりません。初回のみ手入力してください。入力した値はこのGitHub PagesドメインのLocalStorageに保存します。";
  }
}
loadSavedToken();

$("go").onclick=async()=>{
  const f=$("file").files[0];
  if(!f)return alert("PDFを選択してください。");

  const token=$("token").value.trim();
  if(!token)return alert("同期トークンを入力してください。");

  localStorage.setItem(TOKEN_KEY,token);

  $("status").className="";
  $("status").textContent="解析中...";
  $("out").textContent="";

  try{
    const pdf_base64=await fileToBase64(f);

    const a=await fetch($("analyzerUrl").value.trim(),{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({filename:f.name,pdf_base64})
    });

    const aj=await a.json();
    if(!a.ok||!aj.ok)throw new Error(aj.error||"AI解析失敗");

    $("status").textContent="解析完了 → 出荷指示照合中...";

    const m=await fetch($("matchUrl").value.trim(),{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-kombu-sync-token":token
      },
      body:JSON.stringify({analysis:aj.analysis})
    });

    const mj=await m.json();
    if(!m.ok||!mj.ok){
      throw new Error((mj.error||"照合失敗") + (m.status ? ` (HTTP ${m.status})` : ""));
    }

    $("status").className="ok";
    $("status").textContent="完了";
    $("out").textContent=JSON.stringify({
      analysis:aj.analysis,
      match:mj
    },null,2);

  }catch(e){
    $("status").className="err";
    $("status").textContent="エラー";
    $("out").textContent=String(e?.message||e);
  }
};
</script>
</body>
</html>
